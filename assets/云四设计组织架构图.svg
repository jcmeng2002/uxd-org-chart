<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 830" width="1060" height="830">
  <defs>
    <style>
      text { font-family: 'TencentSans', '腾讯体', 'PingFang SC', sans-serif; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1060" height="830" fill="#FAFBFD"/>

  <!-- 标题 -->
  <text x="530" y="36" text-anchor="middle" fill="#1A1A1A" font-size="18" font-weight="700">云产品四部 · 设计组织架构</text>

  <!-- ====== 根节点 ====== -->
  <rect x="24" y="268" width="110" height="40" rx="6" fill="#0052D9"/>
  <text x="79" y="293" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">云产品四部</text>

  <!-- 根→一中心 连接线 -->
  <path d="M134 288 L170 288 L170 85 L210 85" stroke="#C0D0E0" stroke-width="1.5" fill="none"/>
  <!-- 根→二中心 连接线 -->
  <path d="M134 288 L170 288 L170 483 L210 483" stroke="#C0D0E0" stroke-width="1.5" fill="none"/>

  <!-- ==================== 腾讯云设计一中心 ==================== -->
  <g>
    <!-- 中心卡片 -->
    <rect x="210" y="60" width="380" height="50" rx="6" fill="#0052D9"/>
    <text x="226" y="82" fill="#FFFFFF" font-size="13" font-weight="700">腾讯云设计一中心</text>
    <text x="226" y="100" fill="#B8D4FF" font-size="10">82人 · 负责人 sissiwu(吴茜)</text>

    <!-- 职责说明（框外右侧） -->
    <text x="600" y="74" fill="#7A8899" font-size="9">聚焦基础&amp;平台产品与开发者用户体验</text>
    <text x="600" y="86" fill="#7A8899" font-size="9">负责腾讯云官网平台与基础产品的体验设计与品牌设计</text>
    <text x="600" y="98" fill="#7A8899" font-size="9">负责基础与平台产品及主要PaaS&amp;SaaS相关产品的UI开发与设计效率工具研发</text>

    <!-- 设计一组 15人 -->
    <rect x="210" y="120" width="380" height="48" rx="5" fill="#F0F5FF" stroke="#C8DAF8" stroke-width="1"/>
    <text x="226" y="140" fill="#1A1A1A" font-size="11" font-weight="600">设计一组</text>
    <text x="296" y="140" fill="#2671E8" font-size="10" font-weight="600">15人</text>
    <text x="340" y="140" fill="#5A6A7A" font-size="9">负责人 milachien(簡如郡)</text>
    <text x="226" y="158" fill="#7A8899" font-size="9">视觉设计、交互设计</text>

    <!-- 设计二组 21人 -->
    <rect x="210" y="174" width="380" height="48" rx="5" fill="#F0F5FF" stroke="#C8DAF8" stroke-width="1"/>
    <text x="226" y="194" fill="#1A1A1A" font-size="11" font-weight="600">设计二组</text>
    <text x="296" y="194" fill="#2671E8" font-size="10" font-weight="600">21人</text>
    <text x="340" y="194" fill="#5A6A7A" font-size="9">负责人 wenjuli(李文举)</text>
    <text x="226" y="212" fill="#7A8899" font-size="9">视觉设计、交互设计、产品体验设计</text>

    <!-- 设计三组 13人 -->
    <rect x="210" y="228" width="380" height="48" rx="5" fill="#F0F5FF" stroke="#C8DAF8" stroke-width="1"/>
    <text x="226" y="248" fill="#1A1A1A" font-size="11" font-weight="600">设计三组</text>
    <text x="296" y="248" fill="#2671E8" font-size="10" font-weight="600">13人</text>
    <text x="340" y="248" fill="#5A6A7A" font-size="9">负责人 sissiwu(吴茜)</text>
    <text x="226" y="266" fill="#7A8899" font-size="9">云智团队人员</text>

    <!-- 设计四组 12人 -->
    <rect x="210" y="282" width="380" height="48" rx="5" fill="#F0F5FF" stroke="#C8DAF8" stroke-width="1"/>
    <text x="226" y="302" fill="#1A1A1A" font-size="11" font-weight="600">设计四组</text>
    <text x="296" y="302" fill="#2671E8" font-size="10" font-weight="600">12人</text>
    <text x="340" y="302" fill="#5A6A7A" font-size="9">负责人 sissiwu(吴茜)</text>
    <text x="226" y="320" fill="#7A8899" font-size="9">视觉设计、交互设计、产品体验设计</text>

    <!-- 设计五组 12人 -->
    <rect x="210" y="336" width="380" height="48" rx="5" fill="#F0F5FF" stroke="#C8DAF8" stroke-width="1"/>
    <text x="226" y="356" fill="#1A1A1A" font-size="11" font-weight="600">设计五组</text>
    <text x="296" y="356" fill="#2671E8" font-size="10" font-weight="600">12人</text>
    <text x="340" y="356" fill="#5A6A7A" font-size="9">负责人 sissiwu(吴茜)</text>
    <text x="226" y="374" fill="#7A8899" font-size="9">视觉设计、交互设计、产品体验设计</text>

    <!-- 体验研发组 12人 -->
    <rect x="210" y="390" width="380" height="48" rx="5" fill="#EBF2FE" stroke="#8FB8FF" stroke-width="1"/>
    <text x="226" y="410" fill="#1A1A1A" font-size="11" font-weight="600">体验研发组</text>
    <text x="306" y="410" fill="#2671E8" font-size="10" font-weight="600">12人</text>
    <text x="350" y="410" fill="#5A6A7A" font-size="9">负责人 wenjuli(李文举)</text>
    <text x="226" y="428" fill="#7A8899" font-size="9">前端开发、UI开发、产品体验设计</text>

    <!-- 左侧树形连接线 -->
    <path d="M204 144 L204 414" stroke="#C0D0E0" stroke-width="1" fill="none"/>
    <line x1="204" y1="144" x2="210" y2="144" stroke="#C0D0E0" stroke-width="1"/>
    <line x1="204" y1="198" x2="210" y2="198" stroke="#C0D0E0" stroke-width="1"/>
    <line x1="204" y1="252" x2="210" y2="252" stroke="#C0D0E0" stroke-width="1"/>
    <line x1="204" y1="306" x2="210" y2="306" stroke="#C0D0E0" stroke-width="1"/>
    <line x1="204" y1="360" x2="210" y2="360" stroke="#C0D0E0" stroke-width="1"/>
    <line x1="204" y1="414" x2="210" y2="414" stroke="#C0D0E0" stroke-width="1"/>
  </g>

  <!-- ==================== 腾讯云设计二中心 ==================== -->
  <g>
    <!-- 中心卡片 -->
    <rect x="210" y="458" width="380" height="50" rx="6" fill="#0052D9"/>
    <text x="226" y="480" fill="#FFFFFF" font-size="13" font-weight="700">腾讯云设计二中心</text>
    <text x="226" y="498" fill="#B8D4FF" font-size="10">91人 · 负责人 jinjinliu(刘晶晶)</text>

    <!-- 职责说明（框外右侧） -->
    <text x="600" y="472" fill="#7A8899" font-size="9">聚焦PaaS、SaaS类产品</text>
    <text x="600" y="484" fill="#7A8899" font-size="9">负责相关产品的体验设计、商业化设计、品牌运营设计</text>

    <!-- 设计一组 11人 -->
    <rect x="210" y="518" width="380" height="48" rx="5" fill="#F0F5FF" stroke="#C8DAF8" stroke-width="1"/>
    <text x="226" y="538" fill="#1A1A1A" font-size="11" font-weight="600">设计一组</text>
    <text x="296" y="538" fill="#2671E8" font-size="10" font-weight="600">11人</text>
    <text x="340" y="538" fill="#5A6A7A" font-size="9">负责人 jinjinliu(刘晶晶)</text>
    <text x="226" y="556" fill="#7A8899" font-size="9">云智团队人员</text>

    <!-- 设计二组 34人 -->
    <rect x="210" y="572" width="380" height="48" rx="5" fill="#F0F5FF" stroke="#C8DAF8" stroke-width="1"/>
    <text x="226" y="592" fill="#1A1A1A" font-size="11" font-weight="600">设计二组</text>
    <text x="296" y="592" fill="#2671E8" font-size="10" font-weight="600">34人</text>
    <text x="340" y="592" fill="#5A6A7A" font-size="9">负责人 nasahe(何俊志)</text>
    <text x="226" y="610" fill="#7A8899" font-size="9">产品体验、视觉、交互、UI开发</text>

    <!-- 设计三组 25人 -->
    <rect x="210" y="626" width="380" height="48" rx="5" fill="#F0F5FF" stroke="#C8DAF8" stroke-width="1"/>
    <text x="226" y="646" fill="#1A1A1A" font-size="11" font-weight="600">设计三组</text>
    <text x="296" y="646" fill="#2671E8" font-size="10" font-weight="600">25人</text>
    <text x="340" y="646" fill="#5A6A7A" font-size="9">负责人 silviazhang(张雪慧)</text>
    <text x="226" y="664" fill="#7A8899" font-size="9">产品体验、视觉、交互设计</text>

    <!-- 设计四组 10人 — 腾讯文档 -->
    <rect x="210" y="680" width="380" height="48" rx="5" fill="#E8F0FE" stroke="#5B9BF0" stroke-width="1"/>
    <rect x="210" y="680" width="4" height="48" rx="2" fill="#2671E8"/>
    <text x="224" y="700" fill="#1A1A1A" font-size="11" font-weight="600">设计四组</text>
    <text x="294" y="700" fill="#2671E8" font-size="10" font-weight="600">10人</text>
    <text x="338" y="700" fill="#5A6A7A" font-size="9">负责人 jinjinliu(刘晶晶)</text>
    <text x="224" y="718" fill="#7A8899" font-size="9">产品体验、视觉、交互设计</text>
    <!-- 服务产品（框外） -->
    <text x="600" y="706" fill="#2671E8" font-size="10" font-weight="600">→ 腾讯文档</text>

    <!-- 设计五组 13人 — ima -->
    <rect x="210" y="734" width="380" height="48" rx="5" fill="#E8F0FE" stroke="#5B9BF0" stroke-width="1"/>
    <rect x="210" y="734" width="4" height="48" rx="2" fill="#2671E8"/>
    <text x="224" y="754" fill="#1A1A1A" font-size="11" font-weight="600">设计五组</text>
    <text x="294" y="754" fill="#2671E8" font-size="10" font-weight="600">13人</text>
    <text x="338" y="754" fill="#5A6A7A" font-size="9">负责人 ivyliang(梁颖蕾)</text>
    <text x="224" y="772" fill="#7A8899" font-size="9">产品体验、视觉、交互设计</text>
    <!-- 服务产品（框外） -->
    <text x="600" y="760" fill="#2671E8" font-size="10" font-weight="600">→ ima</text>

    <!-- 左侧树形连接线 -->
    <path d="M204 542 L204 758" stroke="#C0D0E0" stroke-width="1" fill="none"/>
    <line x1="204" y1="542" x2="210" y2="542" stroke="#C0D0E0" stroke-width="1"/>
    <line x1="204" y1="596" x2="210" y2="596" stroke="#C0D0E0" stroke-width="1"/>
    <line x1="204" y1="650" x2="210" y2="650" stroke="#C0D0E0" stroke-width="1"/>
    <line x1="204" y1="704" x2="210" y2="704" stroke="#C0D0E0" stroke-width="1"/>
    <line x1="204" y1="758" x2="210" y2="758" stroke="#C0D0E0" stroke-width="1"/>
  </g>

  <!-- 图例 -->
  <g transform="translate(210, 800)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#E8F0FE" stroke="#5B9BF0" stroke-width="1"/>
    <text x="16" y="9" fill="#7A8899" font-size="9">负责具体产品线</text>
    <rect x="130" y="0" width="10" height="10" rx="2" fill="#F0F5FF" stroke="#C8DAF8" stroke-width="1"/>
    <text x="146" y="9" fill="#7A8899" font-size="9">通用设计能力组</text>
  </g>
</svg>