<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580">
<defs>
  <style>
    text { font-family: 'TencentSans', '腾讯体', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <filter id="s" x="-2%" y="-1%" width="104%" height="104%">
    <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0052D9" flood-opacity="0.05"/>
  </filter>
  <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0052D9"/><stop offset="100%" stop-color="#2671E8"/>
  </linearGradient>
</defs>

<!-- 背景 -->
<rect width="1000" height="580" fill="#F5F7FA"/>

<!-- 标题栏 -->
<rect x="24" y="14" width="952" height="48" rx="8" fill="url(#hg)"/>
<text x="50" y="44" fill="white" font-size="18" font-weight="700">CSIG 设计体系架构</text>
<text x="950" y="40" text-anchor="end" fill="white" font-size="11" opacity="0.7">按设计资源服务范围划分 · 2026</text>

<!-- ═══ Tier 1: 服务于部门/大体量产品的设计团队 ═══ -->
<rect x="24" y="74" width="952" height="320" rx="8" fill="white" filter="url(#s)"/>
<rect x="24" y="74" width="4" height="320" rx="2" fill="#0052D9"/>

<rect x="44" y="86" width="24" height="24" rx="12" fill="#0052D9"/>
<text x="56" y="103" text-anchor="middle" fill="white" font-size="12" font-weight="700">1</text>
<text x="78" y="100" fill="#003C99" font-size="14" font-weight="700">服务于部门/大体量产品的设计团队</text>

<!-- Row 1: 云四 + 地图 -->
<rect x="44" y="120" width="451" height="86" rx="6" fill="#F6F9FF"/>
<rect x="44" y="120" width="3" height="86" rx="1.5" fill="#0052D9"/>
<text x="58" y="138" fill="#1A1A1A" font-size="12" font-weight="700">云产品四部 · 设计一中心 / 设计二中心</text>
<text x="58" y="152" fill="#7A8899" font-size="9">173人 · 一中心：设计一/二/三/四/五组 · 体验研发组</text>
<text x="58" y="164" fill="#7A8899" font-size="9">二中心：设计一/二/三/四/五组</text>
<text x="58" y="180" fill="#3B7DD8" font-size="9">服务腾讯云、ima、文档等产品</text>

<rect x="505" y="120" width="451" height="86" rx="6" fill="#F6F9FF"/>
<rect x="505" y="120" width="3" height="86" rx="1.5" fill="#0052D9"/>
<text x="519" y="138" fill="#1A1A1A" font-size="12" font-weight="700">地图产品部 · 产品体验设计中心</text>
<text x="519" y="152" fill="#7A8899" font-size="9">49人 · 产品设计一/二/三组</text>
<text x="519" y="180" fill="#3B7DD8" font-size="9">服务地图、出行等相关产品</text>

<!-- Row 2: 用户体验设计部 + 元宝 -->
<rect x="44" y="214" width="451" height="110" rx="6" fill="#F6F9FF"/>
<rect x="44" y="214" width="3" height="110" rx="1.5" fill="#0052D9"/>
<text x="58" y="232" fill="#1A1A1A" font-size="12" font-weight="700">用户体验设计部</text>
<text x="58" y="246" fill="#7A8899" font-size="9">87人 · 产品设计中心 · 搜索与内容设计中心 · 工具与商业化设计中心</text>
<text x="58" y="258" fill="#7A8899" font-size="9">技术平台设计中心 · 设计研发工作室 · 品牌与研用组</text>
<text x="58" y="274" fill="#7A8899" font-size="9">曾服务于信息平台与服务线（内容产品中心 · 应用技术部 · 平台产品部 · 用户体验设计部 · 业务发展中心）</text>
<text x="58" y="290" fill="#3B7DD8" font-size="9">现服务于输入法部、浏览器产品部</text>

<rect x="505" y="214" width="451" height="86" rx="6" fill="#F6F9FF"/>
<rect x="505" y="214" width="3" height="86" rx="1.5" fill="#0052D9"/>
<text x="519" y="232" fill="#1A1A1A" font-size="12" font-weight="700">元宝产品部 · 设计中心</text>
<text x="519" y="246" fill="#7A8899" font-size="9">53人 · 设计一组 · 设计二组</text>
<text x="519" y="274" fill="#3B7DD8" font-size="9">服务于整体元宝产品部（含会议等）</text>

<!-- 可能还有 -->
<line x1="44" y1="340" x2="952" y2="340" stroke="#E0E6EE" stroke-width="0.5" stroke-dasharray="3,3"/>
<text x="44" y="356" fill="#7A8899" font-size="9" font-style="italic">可能还有部分团队，待后续补充</text>


<!-- ═══ Tier 2: 团队内有D族员工 ═══ -->
<rect x="24" y="378" width="952" height="132" rx="8" fill="white" filter="url(#s)"/>
<rect x="24" y="378" width="4" height="132" rx="2" fill="#2671E8"/>

<rect x="44" y="390" width="24" height="24" rx="12" fill="#2671E8"/>
<text x="56" y="407" text-anchor="middle" fill="white" font-size="12" font-weight="700">2</text>
<text x="78" y="404" fill="#185FA5" font-size="14" font-weight="700">团队内有D族员工</text>
<text x="78" y="418" fill="#7A8899" font-size="9">没有集中的设计团队服务，但团队里有设计职位的员工</text>

<!-- 2个部门 -->
<rect x="44" y="432" width="451" height="50" rx="6" fill="#F4F8FF"/>
<rect x="44" y="432" width="3" height="50" rx="1.5" fill="#2671E8"/>
<text x="58" y="450" fill="#1A1A1A" font-size="12" font-weight="700">业务经营管理部</text>
<text x="58" y="464" fill="#7A8899" font-size="9">磐石研发中心 · 前端开发组 · 磐石产品中心</text>

<rect x="505" y="432" width="451" height="50" rx="6" fill="#F4F8FF"/>
<rect x="505" y="432" width="3" height="50" rx="1.5" fill="#2671E8"/>
<text x="519" y="450" fill="#1A1A1A" font-size="12" font-weight="700">营销与交易产品部</text>
<text x="519" y="464" fill="#7A8899" font-size="9">营销云产品中心 · 产品二组</text>

<!-- 可能还有 -->
<line x1="44" y1="482" x2="952" y2="482" stroke="#E0E6EE" stroke-width="0.5" stroke-dasharray="3,3"/>
<text x="44" y="496" fill="#7A8899" font-size="9" font-style="italic">可能还有部分团队，待后续补充</text>


<!-- ═══ 底部图例 ═══ -->
<rect x="24" y="530" width="952" height="28" rx="8" fill="white" filter="url(#s)"/>
<rect x="44" y="539" width="12" height="10" rx="2" fill="#0052D9"/>
<text x="62" y="548" fill="#666" font-size="9">服务于部门/大体量产品的设计团队</text>
<rect x="260" y="539" width="12" height="10" rx="2" fill="#2671E8"/>
<text x="278" y="548" fill="#666" font-size="9">团队内有D族员工</text>

</svg>