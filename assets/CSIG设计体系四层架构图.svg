<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2200" width="1600" height="2200">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  </style>
  <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="108%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0052D9" flood-opacity="0.08"/>
  </filter>
  <filter id="shadow-md" x="-3%" y="-3%" width="106%" height="112%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0052D9" flood-opacity="0.12"/>
  </filter>
  <filter id="shadow-lg" x="-4%" y="-4%" width="108%" height="116%">
    <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#0052D9" flood-opacity="0.15"/>
  </filter>
  <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0052D9"/>
    <stop offset="100%" stop-color="#003C99"/>
  </linearGradient>
  <linearGradient id="l1Grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#003C99"/>
    <stop offset="100%" stop-color="#0052D9"/>
  </linearGradient>
  <linearGradient id="l2Grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2671E8"/>
    <stop offset="100%" stop-color="#0052D9"/>
  </linearGradient>
  <linearGradient id="l3Grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0D7C5F"/>
    <stop offset="100%" stop-color="#0A6350"/>
  </linearGradient>
  <linearGradient id="l4Grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#C58520"/>
    <stop offset="100%" stop-color="#A06B10"/>
  </linearGradient>
  <clipPath id="roundClip"><rect x="0" y="0" width="1600" height="2200" rx="0"/></clipPath>
</defs>

<!-- Background -->
<rect width="1600" height="2200" fill="#F5F8FC"/>

<!-- ===== HEADER ===== -->
<rect x="0" y="0" width="1600" height="180" fill="url(#headerGrad)"/>
