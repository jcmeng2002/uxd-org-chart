<text x="800" y="72" text-anchor="middle" fill="white" font-size="14" font-weight="500" letter-spacing="4" opacity="0.8">CSIG · DESIGN SYSTEM ARCHITECTURE</text>
<text x="800" y="120" text-anchor="middle" fill="white" font-size="40" font-weight="700" letter-spacing="6">CSIG 设计体系四层架构图</text>
<text x="800" y="155" text-anchor="middle" fill="white" font-size="16" font-weight="400" opacity="0.85">按设计资源归属与管理层级划分 · 2026</text>

